[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryapigate"
dynamic = ["version"]
description = "Turn SQL into a REST API: run queries against MySQL, PostgreSQL, ClickHouse, SQLite or H2 over HTTP and get JSON, CSV, XML, YAML or XLSX back."
readme = "README.md"
requires-python = ">=3.9"
license = "FSL-1.1-MIT"
authors = [{ name = "Anantha Raju C", email = "arcswdev@gmail.com" }]
keywords = ["sql", "api", "rest", "flask", "database", "mysql", "postgresql", "clickhouse", "sqlite", "h2", "jdbc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = ["Flask>=2.2", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.0"]
postgres = ["psycopg2-binary>=2.9"]
clickhouse = ["clickhouse-driver>=0.2"]
h2 = ["JayDeBeApi>=1.2", "JPype1>=1.4"]  # also needs a Java runtime
duckdb = ["duckdb>=1.0"]  # Connection.interrupt()/InterruptException, relied on for query timeouts, verified from here
mongo = ["pymongo>=4.0"]
flow = ["sqlglot>=23,<26"]  # best-effort table/join extraction for the Access tab - see sqlflow.py
encryption = ["cryptography>=41"]  # only needed when QUERYAPIGATE_SECRET_KEY is set - see store.py's _get_fernet()
redis = ["redis>=5"]  # only needed when QUERYAPIGATE_REDIS_URL is set - see rediscache.py
mcp = ["mcp>=1.10,<2"]  # only needed for `queryapigate mcp` - see mcp_server.py. 1.10 is the floor because
                        # that's where outputSchema/structuredContent support landed in the SDK (1.9 doesn't
                        # have it). Needs Python >=3.10 (the mcp package's own floor), higher than this
                        # project's own >=3.9 - the same shape h2's extra already needs a JVM beyond what
                        # `pip install` alone provides.
all = ["queryapigate[mysql,postgres,clickhouse,h2,duckdb,mongo,flow,encryption]"]
server = ["gunicorn>=21"]
docs = ["mkdocs-material>=9,<10"]
dev = ["queryapigate[all]", "queryapigate[redis]", "queryapigate[mcp]; python_version>='3.10'", "ruff>=0.5",
      "openapi-spec-validator>=0.7", "hypothesis>=6.100", "mypy>=1.10", "coverage>=7.4"]

[project.urls]
Homepage = "https://github.com/AnanthaRajuC/QueryAPIGate"
Documentation = "https://AnanthaRajuC.github.io/QueryAPIGate/"
Repository = "https://github.com/AnanthaRajuC/QueryAPIGate"
Issues = "https://github.com/AnanthaRajuC/QueryAPIGate/issues"
Changelog = "https://github.com/AnanthaRajuC/QueryAPIGate/blob/main/CHANGELOG.md"

[project.scripts]
queryapigate = "queryapigate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "queryapigate.__version__" }

[tool.setuptools.packages.find]
include = ["queryapigate*"]

[tool.setuptools.package-data]
queryapigate = ["lib/*.jar"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# queryapigate/ui.py is a single Python string holding a hand-written HTML/CSS/JS page (the admin UI at
# /ui), not Python source to format - line length there reflects the page's own JS style, not ours.
"queryapigate/ui.py" = ["E501"]

[tool.mypy]
# Gradual typing: the codebase has no type hints yet, so this catches real static errors (like a subclass
# assigning the wrong type to a base class's annotated attribute) without demanding annotations everywhere -
# a starting point to tighten later, not a finished type-checked codebase. No python_version pin: mypy 2.x
# can no longer check against 3.9 (this project's actual floor - see requires-python) since upstream mypy
# dropped it once 3.9 reached end of life; real 3.9 compatibility is still verified for real by CI actually
# running the test suite on 3.9.
ignore_missing_imports = true  # none of the DB drivers ship type stubs
# Belt and braces: mypy 1.x and 2.x disagree on whether ignore_missing_imports alone covers a module that's
# installed but has no stubs/py.typed marker (PyYAML, openpyxl, ...) - the "import-untyped" error code, as
# opposed to one mypy can't find at all ("import-not-found") - so silence that code explicitly too. Found by
# CI actually running Python 3.9, which resolves an older mypy than this project's own dev environment.
disable_error_code = ["import-untyped"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["queryapigate"]
omit = ["queryapigate/ui.py"]  # a hand-written HTML/JS page in a Python string, not code coverage measures
