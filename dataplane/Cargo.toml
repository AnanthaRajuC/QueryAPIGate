[package]
name = "queryapigate-dataplane"
# The release's, as queryapigate/__init__.py's: Python pairs only with its own (ADR 0030). tests/test_dataplane.py checks.
version = "0.47.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clickhouse = { version = "0.15.3", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "server"] }
ipnet = "2.12.2"
percent-encoding = "2.3.2"
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "mysql", "chrono", "rust_decimal"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
