# Debezium Server for the live queries demo: read PostgreSQL's change log, post each change to QueryAPIGate.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=127.0.0.1
debezium.source.database.port=55432
debezium.source.database.user=postgres
debezium.source.database.password=pw
debezium.source.database.dbname=shop
debezium.source.topic.prefix=shop
debezium.source.table.include.list=public.film
# Don't replay every existing row at startup: live queries only need to hear about changes
debezium.source.snapshot.mode=no_data
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

debezium.sink.type=http
debezium.sink.http.url=http://127.0.0.1:5050/ingest/cdc/shop
# One request per batch of changes, not per changed row: a 1,000-row UPDATE is a handful of requests
debezium.sink.http.batch.enabled=true
debezium.sink.http.authentication.type=standard-webhooks
# A demo-only secret. It must match the "secret" in QUERYAPIGATE_CDC_SOURCES (README.md)
debezium.sink.http.authentication.webhook.secret=whsec_bGl2ZS1xdWVyaWVzLWRlbW8tc2VjcmV0LTAxMjM0NTY=
debezium.format.value=json
# Debezium Server's own HTTP port (health checks). It shares the host's network here, so keep it off 8080.
quarkus.http.port=8089
