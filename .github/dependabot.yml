version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Column masking and table allow-lists read sqlglot's parse tree: a new major changes it (sqlglot 30 renamed
      # `with`/`from` to `with_`/`from_`, which the checks then missed). Moving past <31 is deliberate work, tested
      # on its own with the differential fuzz - not a bump (Dependabot #35, 2026-10-15; 30 adopted in 0.43, #101).
      - dependency-name: sqlglot
        update-types: ["version-update:semver-major"]
      # mcp 2 removed streamablehttp_client, which the MCP server's own clients and tests use (#36).
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init, analyze and upload-sarif must all run the same CodeQL version, or analyze refuses: one PR for all three
      # (#78-#80 came one each and all failed)
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: cargo  # the Rust data plane (ADR 0028); its toolchain is pinned by hand, in rust-toolchain.toml
    directory: /dataplane
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Console builds on an LTS Node, the same as frontend/.nvmrc and the release workflow - moved together,
      # by hand; an odd major (25) is never an LTS (#38).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker  # ClusterFuzzLite's build image, by digest
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
