name: Release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed.
# One-time setup: add this repository as a "trusted publisher" on PyPI (environment name: pypi).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the check below needs history to see whether the tag is on main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag before publishing
        run: python .github/scripts/check_release.py "$GITHUB_REF_NAME"
      # The wheel ships the QueryAPIGate Console's static build (ADR 0001), so users never need Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Console
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - run: pip install build
      - run: python -m build
      - name: The wheel contains the Console
        run: unzip -l dist/*.whl | grep -q 'queryapigate/console_dist/index.html'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
