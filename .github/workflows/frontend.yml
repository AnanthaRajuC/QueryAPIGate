name: Console

# The QueryAPIGate Console (frontend/, ADR 0001). Runs only when the frontend changes, so backend-only pull requests
# never wait on Node. The backend's own test suite separately checks that frontend/openapi.json matches the API.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

# Every job gets a read-only token unless it asks for more (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  console:
    name: Console (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The build landed where the Python package serves it from
        run: test -f ../queryapigate/console_dist/index.html
