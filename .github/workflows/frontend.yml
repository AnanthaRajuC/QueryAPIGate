name: Console

# The QueryAPIGate Console (frontend/, ADR 0001). Runs only when the frontend changes, so backend-only pull requests
# never wait on Node. The backend's own test suite separately checks that frontend/openapi.json matches the API.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  console:
    name: Console (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The build landed where the Python package serves it from
        run: test -f ../queryapigate/console_dist/index.html
