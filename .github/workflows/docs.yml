name: Deploy docs

# Builds the MkDocs site from LANDING.md (the site's own homepage - deliberately not README.md, which is
# GitHub-oriented instead), documentation/ and the other root-level docs (see mkdocs.yml for how the docs/
# folder mirrors their paths) and publishes it to GitHub Pages. First deploy needs Settings -> Pages -> Build
# and deployment -> Source: "GitHub Actions", set once by a repository admin; after that this workflow does the rest.

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/**
      - LANDING.md
      - documentation/**
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - BACKLOG.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push should win, not queue behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9,<10"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
