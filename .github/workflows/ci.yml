name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The release before this one: the rolling-upgrade test serves beside it on an upgraded store, and the Helm chart is
  # upgraded from it on a real cluster. Bumped after each release (CONTRIBUTING.md, Releasing).
  PREVIOUS_RELEASE: "0.43.0"
  # Pinned tools for the Helm chart's jobs (ADR 0013), each download checked against its published checksum.
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.37.0

# Every job gets a read-only token unless it asks for more (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]  # requires-python; see CHANGELOG.md for the policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy queryapigate
      - run: coverage run -m unittest discover -s tests -t . -v
      # Coverage is the same regardless of interpreter, so only measure and upload it once.
      - if: matrix.python == '3.12'
        run: coverage xml
      - if: matrix.python == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          # v4 needs the repository's upload token (Codecov -> the repo's Settings -> General, saved as the
          # CODECOV_TOKEN Actions secret). Without it the upload fails, which fail_ci_if_error: false hides.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    name: Integration (real databases and services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: it
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: pw
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 5s --health-timeout 5s
          --health-retries 20
      trino:  # Trino (experimental, ADR 0026); its built-in HEALTHCHECK gates readiness, plus a wait step below
        image: trinodb/trino:484
        ports: ["8085:8080"]
        # Cap the Trino JVM: unbounded it can starve the other four service containers on the 7 GB runner and a
        # sibling (mongo) then fails to start. Trino 484 auto-sizes its heap from the container limit; 2 GB boots
        # healthy and runs the IT queries using ~0.9 GB, leaving room for postgres/mysql/clickhouse/mongo.
        options: >-
          --memory 2g --memory-swap 2g
    env:
      QUERYAPIGATE_IT_POSTGRES: '{"host": "localhost", "port": 5432, "user": "postgres", "password": "pw", "database": "postgres"}'
      QUERYAPIGATE_IT_MYSQL: '{"host": "127.0.0.1", "port": 3306, "user": "root", "password": "pw", "database": "it"}'
      QUERYAPIGATE_IT_CLICKHOUSE: '{"host": "localhost", "port": 9000, "user": "default", "password": "pw", "database": "default"}'
      QUERYAPIGATE_IT_H2: '{"host": "localhost", "user": "SA", "password": "", "database": "it"}'
      QUERYAPIGATE_IT_MONGO: '{"host": "localhost", "port": 27017, "database": "it"}'
      QUERYAPIGATE_IT_TRINO: '{"host": "localhost", "port": 8085, "user": "ci", "database": "memory", "options": {"schema": "default"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[all,mcp,aws]"
      - run: python .github/scripts/fetch_h2_jar.py  # not committed: from Maven Central, its SHA-256 checked
      - name: Start H2 server
        run: |
          java -cp queryapigate/lib/h2-2.2.224.jar org.h2.tools.Server -tcp -tcpPort 9092 -ifNotExists &
          sleep 5
      - name: Wait for Trino to finish starting (JVM boot)
        run: |
          for i in $(seq 90); do
            curl -sf http://localhost:8085/v1/info | grep -q '"starting":false' && break
            sleep 2
          done
          curl -sf http://localhost:8085/v1/info
      - name: Every database against its real server - none may skip
        run: |
          set -o pipefail  # the tests' own result, not tee's
          python -m unittest tests.test_integration -v 2>&1 | tee /tmp/integration.log
          ! grep -E "skipped '(QUERYAPIGATE_IT_[A-Z0-9_]+ not set|the 'duckdb' package)" /tmp/integration.log
      # Started here rather than as services: neither image can be given its command that way.
      - name: Start an S3-compatible store (SeaweedFS), for exports and files on S3
        run: |
          mkdir -p /tmp/s3cfg
          echo '{"identities": [{"name": "ci", "credentials": [{"accessKey": "testkey", "secretKey": "testsecret"}],
                 "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}' > /tmp/s3cfg/s3.json
          docker run -d --name seaweedfs -p 8333:8333 -v /tmp/s3cfg:/cfg chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/cfg/s3.json
          for i in $(seq 60); do
            docker exec seaweedfs sh -c 'echo "s3.bucket.create -name qagtest" | weed shell' 2>/dev/null \
              | grep -q "created bucket" && break
            sleep 2
          done
      - name: Start Keycloak, for the MCP server's OAuth and Console sign-in
        run: |
          docker run -d --name keycloak -p 8080:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:26.0.7 start-dev
          for i in $(seq 90); do
            curl -sf http://localhost:8080/realms/master/.well-known/openid-configuration > /dev/null && break
            sleep 2
          done
      - name: Start Vault (dev mode), for secrets and short-lived database credentials (ADR 0015)
        run: |
          # reaching the job's PostgreSQL through the host: a container started here isn't on the services' network
          docker run -d --name vault --cap-add=IPC_LOCK --add-host=host.docker.internal:host-gateway -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 hashicorp/vault:1.21.1
          for i in $(seq 30); do curl -sf http://localhost:8200/v1/sys/health > /dev/null && break; sleep 1; done
      - name: Start a Secrets Manager stand-in (moto), for ${aws-sm:...}
        run: |
          docker run -d --name moto -p 5500:5000 motoserver/moto:5.1.18
          for i in $(seq 30); do curl -sf http://localhost:5500/moto-api/ > /dev/null && break; sleep 1; done
      - name: Real SIEM receivers - rsyslog and syslog-ng over mutual TLS, an OpenTelemetry Collector (ADR 0019)
        run: .github/scripts/siem_receivers.sh start /tmp/qag-siem
      - name: Exports, files, OAuth, SSO, Vault, AWS and the SIEM stream against the real services - none may skip
        env:
          QUERYAPIGATE_TEST_S3: localhost:8333,testkey,testsecret,qagtest
          QUERYAPIGATE_TEST_KEYCLOAK: http://localhost:8080
          QUERYAPIGATE_TEST_VAULT_ADDR: http://localhost:8200
          QUERYAPIGATE_TEST_VAULT_TOKEN: root
          QUERYAPIGATE_TEST_VAULT_PG: localhost:5432
          QUERYAPIGATE_TEST_VAULT_PG_FROM_VAULT: host.docker.internal:5432
          QUERYAPIGATE_TEST_AWS_ENDPOINT: http://localhost:5500
          QUERYAPIGATE_TEST_SIEM: /tmp/qag-siem
        run: |
          set -o pipefail  # the tests' own result, not tee's
          python -m unittest -v tests.test_duckdb_files tests.test_destinations tests.test_exports \
            tests.test_exporting tests.test_export_security tests.test_mcp_keycloak tests.test_sso_keycloak \
            tests.test_vault tests.test_aws tests.test_audit_siem 2>&1 | tee /tmp/services.log
          ! grep -E "skipped '(set QUERYAPIGATE_TEST|DuckDB's httpfs)" /tmp/services.log

  fips:
    name: Tests under FIPS (Red Hat UBI 9, OpenSSL's FIPS provider)
    runs-on: ubuntu-latest
    # ADR 0016: a validated module in FIPS mode - Python, OpenSSL and cryptography from the distribution, the FIPS
    # provider forced (there's no FIPS kernel to read it from in CI) - and the whole suite on it.
    container:
      image: registry.access.redhat.com/ubi9/ubi:9.6
      env:
        OPENSSL_FORCE_FIPS_MODE: "1"
    steps:
      - run: dnf -q -y install python3.12 python3.12-pip python3.12-cryptography git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A virtualenv that keeps the distribution's cryptography (PyPI's wheel carries an unvalidated OpenSSL)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3.12 -m venv --system-site-packages /venv
          /venv/bin/pip install -q -e ".[dev]"
          /venv/bin/python -c "import cryptography; assert cryptography.__file__.startswith('/usr/lib64/'), cryptography.__file__"
      - name: The suite, FIPS in force - test_fips first checks that it is
        env:
          QUERYAPIGATE_TEST_FIPS: "1"
        run: QUERYAPIGATE_HOME=$(mktemp -d) /venv/bin/python -m unittest discover -s tests -t . -v

  oldest-dependencies:
    # The lowest versions pyproject.toml allows, so a minimum can't quietly stop being true again: every core
    # dependency, and every extra a stable feature needs (ADR 0017). DuckDB 1.2 is the first that can lock a
    # connection to its paths, sqlglot 25.2 the first masking's tracing works on, mcp 1.21.1 the first that imports
    # beside the pydantic pip installs with it, psycopg2-binary 2.9.5 the first with wheels for Python 3.11.
    # tests/test_dependency_floors.py keeps these pins equal to pyproject.toml's minimums.
    name: Tests (oldest supported dependencies)
    runs-on: ubuntu-latest
    services:
      mongo:  # pymongo's floor, against a real server
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 5s --health-timeout 5s
          --health-retries 20
      postgres:  # psycopg2's floor, against a real store: live events' notifications among it (ADR 0021)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:  # redis 5's client, against a real server: quotas and shared rate limits
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUERYAPIGATE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: >-
          pip install -e ".[dev]" "Flask==3.0.0" "Werkzeug==3.0.0" "PyYAML==6.0.1" "openpyxl==3.1.0"
          "duckdb==1.2.0" "sqlglot==25.2.0" "mcp==1.21.1" "PyJWT[crypto]==2.14.0" "redis==5.0.0"
          "psycopg2-binary==2.9.5" "pymongo==4.0"
      - run: python -m unittest discover -s tests -t . -v
      - name: MongoDB at pymongo's floor, against a real server
        run: python -m unittest tests.test_integration.MongoTests -v
        env:
          QUERYAPIGATE_IT_MONGO: '{"host": "localhost", "port": 27017, "database": "it"}'
      - name: Again, on a PostgreSQL store
        run: python -m unittest discover -s tests -t . -v
        env:
          QUERYAPIGATE_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres

  postgres-metadata:
    # The whole suite again, with the metadata store (connections, saved queries, keys, roles, history, audit
    # log) on PostgreSQL instead of SQLite - tests/__init__.py gives every test its own schema.
    name: Tests (PostgreSQL metadata store)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:  # shared rate limits across instances (BACKLOG #55) - tests/test_shared_rate_limit.py
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUERYAPIGATE_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
      QUERYAPIGATE_TEST_REQUIRE_PG_TOOLS: "1"  # the backup/restore tests must run here, not skip
      QUERYAPIGATE_TEST_REDIS_URL: redis://localhost:6379/0
      # The previous release, for tests/test_rolling_upgrade.py - bump it with each release (RELEASING in CONTRIBUTING.md)
      QUERYAPIGATE_TEST_OLD_BIN: /tmp/previous-release/bin/queryapigate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: pg_dump and pg_restore, for the backup/restore tests (BACKLOG #71)
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: pip install -e ".[dev]"
      - name: The previous release, for the rolling-upgrade test (BACKLOG #58)
        run: python -m venv /tmp/previous-release && /tmp/previous-release/bin/pip install -q "queryapigate[postgres]==$PREVIOUS_RELEASE"
      - run: python -m unittest discover -s tests -t . -v

  console-e2e:
    # The built Console driven in Chromium against a real server (frontend/e2e): every screen and the main flows.
    # Here rather than in frontend.yml because a backend change can break the Console just as well.
    name: Console end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # The optional packages the screens under test use, as the Docker image has them: DuckDB (exports, Parquet,
      # files) and sqlglot (column masking). Without them those features refuse, saying what to install.
      - run: pip install -e ".[duckdb,flow]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Console
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Console, as the release does
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - run: pip install build twine
      - run: python .github/scripts/fetch_h2_jar.py
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contains the bundled H2 driver
        run: unzip -l dist/*.whl | grep h2-2.2.224.jar
      - name: Wheel contains the Console
        run: unzip -l dist/*.whl | grep 'queryapigate/console_dist/index.html'

  demo:
    name: Compose demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the demo (QueryAPIGate and a seeded PostgreSQL)
        # --wait treats a container that exits as a failure, even a one-shot one exiting 0, so the seed runs on its
        # own once the server is healthy - failing this step if it fails.
        run: |
          docker compose up -d --build --wait db queryapigate
          docker compose run --rm seed
      - name: The demo behaves as documented
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5000/connections)" = "401"
          curl -fs -H 'X-API-Key: demo-key' 'localhost:5000/q/films_by_rating?rating=G&max_length=60' | grep -q 'CRIMSON GARDEN'
          curl -s -H 'X-API-Key: demo-key' 'localhost:5000/q/films_by_rating?rating=XX' | grep -q 'must be one of'
          curl -fs -H 'X-API-Key: demo-key' localhost:5000/openapi.json | grep -q '/q/film_by_id'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t queryapigate .
      - name: Container starts and answers
        run: |
          docker run -d --name s2a -p 5000:5000 queryapigate
          for i in $(seq 1 20); do curl -fs localhost:5000/health && exit 0; sleep 1; done
          docker logs s2a; exit 1

  helm-chart:
    # The Helm chart (ADR 0013) with both Helm majors: lint, then rendered with each shape and option and checked
    # (tests/test_helm.py) - refusals, hardening, routes, and the plain manifests kept in step with it.
    name: Helm chart (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.0, v4.3.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Helm ${{ matrix.helm }}, checked against its checksum
        run: |
          curl -sfL -o helm.tgz "https://get.helm.sh/helm-${{ matrix.helm }}-linux-amd64.tar.gz"
          echo "$(curl -sfL "https://get.helm.sh/helm-${{ matrix.helm }}-linux-amd64.tar.gz.sha256sum" | cut -d' ' -f1)  helm.tgz" | sha256sum -c
          tar xzf helm.tgz && sudo mv linux-amd64/helm /usr/local/bin/helm && helm version
      - run: helm lint deploy/helm/queryapigate --set secret.create=true --set secret.values.QUERYAPIGATE_API_KEY=k
      - run: pip install -e .
      - run: python -m unittest tests.test_helm -v

  helm-kind:
    # The chart on a real cluster: both shapes, and an upgrade from the previous release - its published chart once
    # there is one - to this commit's image while a pod keeps calling it. No request may fail.
    name: Helm chart on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: kind, kubectl and Helm, checked against their checksums
        run: |
          curl -sfL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$(curl -sfL "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64.sha256sum" | cut -d' ' -f1)  kind" | sha256sum -c
          curl -sfL -o kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -sfL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c
          curl -sfL -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "$(curl -sfL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum | cut -d' ' -f1)  helm.tgz" | sha256sum -c
          tar xzf helm.tgz && chmod +x kind kubectl && sudo mv kind kubectl linux-amd64/helm /usr/local/bin/
      - run: docker build -t queryapigate:chart-test .
      - name: The previous release's chart, if it was published
        run: |
          if helm show chart "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/queryapigate" --version "$PREVIOUS_RELEASE" >/dev/null 2>&1; then
            echo "PREVIOUS_CHART=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/queryapigate --version $PREVIOUS_RELEASE" >> "$GITHUB_ENV"
          fi
      - name: Install, smoke-test, upgrade under load
        run: .github/scripts/kind_chart_test.sh
        env:
          IMAGE: queryapigate:chart-test
          PREVIOUS_IMAGE: ghcr.io/anantharajuc/queryapigate:${{ env.PREVIOUS_RELEASE }}
