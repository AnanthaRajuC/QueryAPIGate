name: Publish Docker image

# Builds the image (plain and H2 variants) and the Helm chart and publishes them to GitHub Container Registry when a
# version tag is pushed - each signed keyless with cosign, with SLSA provenance, an SBOM and a GitHub attestation, and
# verified before the job ends (ADR 0018). Images: ghcr.io/<owner>/queryapigate:<version>, :latest, :<version>-h2,
# :latest-h2; the chart: oci://ghcr.io/<owner>/charts/queryapigate.
#
# By hand (Actions -> Publish Docker image -> Run workflow): on a branch it builds and pushes nothing; with `rehearse`,
# it does everything a release does - push, sign, attest, verify - to queryapigate-rehearsal and charts-rehearsal,
# never the real names, so signing is tried end to end before a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Also push the images (only takes effect when run on a tag)"
        type: boolean
        default: false
      rehearse:
        description: "Push, sign and verify everything under -rehearsal names (on a branch)"
        type: boolean
        default: false

env:
  COSIGN_VERSION: v3.1.3
  # Who a signature says built it: this workflow, at the ref it ran on - refs/tags/vX.Y.Z for a release
  OIDC_ISSUER: https://token.actions.githubusercontent.com

# Every job gets a read-only token unless it asks for more (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  image:
    name: Image${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # the OIDC token cosign trades for a signing certificate - no key is stored anywhere
      attestations: write   # GitHub's own attestation of the build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            with_h2: "false"
          - variant: "-h2"
            with_h2: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the release check needs history to see whether the tag is on main

      - name: Check the tag before publishing
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/check_release.py "$GITHUB_REF_NAME"

      - name: Work out image names and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # registry names must be lower case
          suffix="${{ matrix.variant }}"
          push=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$image:${version}${suffix}"
            case "$version" in *-*) ;; *) tags="$tags,$image:latest${suffix}" ;; esac  # pre-releases never become latest
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then push=true; fi
          elif [ "${{ inputs.rehearse }}" = "true" ]; then
            image="$image-rehearsal"              # never the real name: a rehearsal can't be mistaken for a release
            version="dev"
            tags="$image:rehearsal-${GITHUB_SHA::12}${suffix}"
            push=true
          else
            version="dev"
            tags="$image:dry-run${suffix}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags (push: $push)"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build for this machine (to test it)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: queryapigate-smoke
          build-args: WITH_H2=${{ matrix.with_h2 }}
          cache-from: type=gha,scope=image${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.variant }}

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 5000:5000 queryapigate-smoke
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = "healthy" ] && break
            sleep 2
          done
          docker logs smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = "healthy"
          health="$(curl -fs localhost:5000/health)"
          echo "$health"
          if [ "${{ steps.meta.outputs.version }}" != "dev" ]; then
            echo "$health" | grep -q "\"version\":\"${{ steps.meta.outputs.version }}\"" \
              || { echo "::error::The image reports a different version than the tag"; exit 1; }
          fi
          if [ "${{ matrix.with_h2 }}" = "true" ]; then
            docker exec smoke python -c "import jaydebeapi, jpype" && docker exec smoke java -version
          fi

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for amd64 and arm64${{ steps.meta.outputs.push == 'true' && ' and push' || ' (not pushing)' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # SLSA provenance (how, from what, by which workflow) and an SPDX SBOM, attached to the image index
          provenance: ${{ steps.meta.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.meta.outputs.push == 'true' }}
          build-args: WITH_H2=${{ matrix.with_h2 }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.variant }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.meta.outputs.push == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the image, keyless, by digest
        if: steps.meta.outputs.push == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        # Twice: the Sigstore bundle (an OCI referrer) cosign v3 and `gh` read, and the classic `.sig` tag Sigstore's
        # policy-controller and other admission controllers still look for - without it they find no signature at all
        run: |
          cosign sign --yes "$REF"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$REF"

      - name: Attest how it was built (GitHub)
        if: steps.meta.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify it, as a deployer would
        if: steps.meta.outputs.push == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in true false; do   # each form on its own: the bundle, then the classic .sig
            cosign verify "$REF" --new-bundle-format=$bundle \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          done
          echo "signed by $IDENTITY"
          gh attestation verify "oci://$REF" --owner "$GITHUB_REPOSITORY_OWNER"
          echo "### $REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed by \`$IDENTITY\`" >> "$GITHUB_STEP_SUMMARY"

  chart:
    # The Helm chart (ADR 0013), released in lockstep: chart X.Y.Z runs image X.Y.Z, pushed to ghcr as an OCI artifact
    # beside it - oci://ghcr.io/<owner>/charts/queryapigate.
    name: Helm chart
    if: github.ref_type == 'tag' || inputs.rehearse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag before publishing
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Helm, checked against its checksum
        run: |
          curl -sfL -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "$(curl -sfL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum | cut -d' ' -f1)  helm.tgz" | sha256sum -c
          tar xzf helm.tgz && sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Package and push
        id: push
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            push=false
            if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then push=true; fi
          else
            registry="$registry-rehearsal"; version="0.0.0-rehearsal.${GITHUB_RUN_NUMBER}"; push=true
          fi
          helm package deploy/helm/queryapigate --version "$version" --app-version "$version"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          if [ "$push" = "true" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
            helm push "queryapigate-$version.tgz" "oci://$registry" 2>&1 | tee push.log
            digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | tail -1)
            [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
            echo "ref=$registry/queryapigate@$digest" >> "$GITHUB_OUTPUT"
            echo "name=$registry/queryapigate" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outputs.push == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the chart, keyless, by digest
        if: steps.push.outputs.push == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$REF"   # both forms, as for the image
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$REF"

      - name: Attest how it was built (GitHub)
        if: steps.push.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify it, as a deployer would
        if: steps.push.outputs.push == 'true'
        env:
          REF: ${{ steps.push.outputs.ref }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in true false; do   # each form on its own: the bundle, then the classic .sig
            cosign verify "$REF" --new-bundle-format=$bundle \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          done
          echo "signed by $IDENTITY"
          gh attestation verify "oci://$REF" --owner "$GITHUB_REPOSITORY_OWNER"
          echo "### $REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed by \`$IDENTITY\`" >> "$GITHUB_STEP_SUMMARY"
