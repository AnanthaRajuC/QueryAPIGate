# Copy to secret.yaml, fill in, and keep it out of version control (or create the Secret from your secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: queryapigate
type: Opaque
stringData:
  QUERYAPIGATE_API_KEY: ""            # openssl rand -hex 32
  QUERYAPIGATE_DATABASE_URL: ""       # postgresql://queryapigate:PASSWORD@postgres.internal:5432/queryapigate
  QUERYAPIGATE_REDIS_URL: ""          # redis://redis.internal:6379/0
  QUERYAPIGATE_SECRET_KEY: ""         # the same on every instance - keep a copy in your secret manager
