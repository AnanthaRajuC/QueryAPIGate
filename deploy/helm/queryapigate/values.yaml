# QueryAPIGate's Helm chart (ADR 0013) - stable since 0.30: values may be added, none renamed or removed but through
# the deprecation process (CHANGELOG.md).
# Everything here has a working default; a real install sets at least the secret, and for several instances the
# PostgreSQL store and Redis.

image:
  repository: ghcr.io/anantharajuc/queryapigate
  # Defaults to the chart's appVersion - the release this chart was made with. Pin it rather than use a moving tag.
  tag: ""
  # The digest you verified (cosign verify - ADR 0018, guide 59): pulled by it, so the bytes are the ones signed
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where QueryAPIGate keeps its store - connections, saved queries, keys, history, the audit log.
store:
  # sqlite: one pod, queryapigate.db on a PersistentVolumeClaim - to try it, or a small internal deployment.
  # postgres: several pods on one PostgreSQL store; QUERYAPIGATE_DATABASE_URL must be in the secret.
  type: sqlite
  persistence:   # sqlite only
    size: 1Gi
    storageClass: ""   # the cluster's default
    accessModes: [ReadWriteOnce]
    existingClaim: ""  # use a PersistentVolumeClaim you made instead

# Pods of the API server. More than one needs store.type postgres and Redis (QUERYAPIGATE_REDIS_URL in the secret), or
# rate limits, max_concurrent and quotas would each be counted per pod - the chart refuses.
replicas: 1
redis:
  # QUERYAPIGATE_REDIS_URL is in the existingSecret (the chart can't see inside one): set this to say so.
  inExistingSecret: false

# The settings that are secrets - QUERYAPIGATE_API_KEY, QUERYAPIGATE_SECRET_KEY, QUERYAPIGATE_DATABASE_URL,
# QUERYAPIGATE_REDIS_URL, QUERYAPIGATE_AUDIT_KEY, ... - as environment variables from a Secret.
existingSecret: ""   # recommended: a Secret you manage (sealed-secrets, External Secrets, Vault, by hand)
secret:
  create: false      # or let the chart make one from these values - they then sit in your values file
  values: {}
    # QUERYAPIGATE_API_KEY: change-me
    # QUERYAPIGATE_SECRET_KEY: <a Fernet key>
    # QUERYAPIGATE_DATABASE_URL: postgresql://queryapigate:...@db:5432/queryapigate
    # QUERYAPIGATE_REDIS_URL: redis://redis:6379/0

# Every other setting, as environment variables - any QUERYAPIGATE_* or OTEL_* (Settings in the Console lists them).
# Plain text in the Deployment, so the secret ones (keys, the database and Redis URLs, OTLP headers) are refused here.
config: {}
  # QUERYAPIGATE_ALLOW_WRITES: "1"
  # Reuse the key, saved query and connection a call reads for this many seconds, instead of reading the store each
  # time - 10-20% more throughput. Off by default: each pod caches on its own, so with several replicas a key revoked
  # through one keeps working on the others for up to that long. With one replica, a few seconds is safe.
  # QUERYAPIGATE_METADATA_CACHE_TTL: "5"
  # QUERYAPIGATE_HSTS_MAX_AGE: "31536000"
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# Configuration as code (ADR 0014): connections, queries, roles, keys' grants and the rest as one file,
# applied by the API server as it starts - once per file. Changing it rolls the pods, and the first new one applies it;
# one that can't be applied doesn't start, and the pods still serving keep what they have. No secret goes in the file:
# passwords are ${VAR} references to variables in the Secret, keys are their secret_sha256.
configAsCode:
  enabled: false
  file: ""               # the file itself, inline - or --set-file configAsCode.file=queryapigate.yaml
  existingConfigMap: ""  # or a ConfigMap you manage, with the file under `key` (a change to it doesn't roll the pods)
  key: queryapigate.yaml
  prune: false           # also delete what a file manages and this one no longer has
  locked: false          # what the file manages can be changed only through it - not the Console or the API

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: api.example.com
  tls:
    enabled: true
    secretName: queryapigate-tls
  # ingress-nginx's: /events must reach the client unbuffered. Another controller: replace them with its own.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

# Live events for many clients (`queryapigate events`), routed at /events through the ingress.
events:
  enabled: false
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# The MCP server for AI agents (`queryapigate mcp`), its own Service - and its own host, when mcp.ingress.host is set.
mcp:
  enabled: false
  replicas: 1
  service:
    port: 80
  ingress:
    host: ""   # e.g. mcp.example.com; empty: reachable in the cluster only
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 1Gi}

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 1Gi}

# Kept on unless you have a reason: the image writes only to /data (the store) and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

podDisruptionBudget:
  enabled: true      # with more than one replica
  minAvailable: ""   # default: all but one

serviceAccount:
  create: true
  name: ""
  # IRSA, for ${aws-sm:...} and aws-rds-iam (ADR 0015): eks.amazonaws.com/role-arn: arn:aws:iam::...:role/queryapigate
  annotations: {}
  automountToken: false   # QueryAPIGate never calls the Kubernetes API: no token for it

# Vault's Kubernetes auth (ADR 0015): a token for Vault alone - projected, short-lived, kubelet-rotated - set as
# QUERYAPIGATE_VAULT_K8S_TOKEN_FILE. Not the service account token above, which would also reach the Kubernetes API.
vaultToken:
  enabled: false
  audience: ""            # the audience the Vault role checks, if it names one
  expirationSeconds: 3600

# /metrics needs a bearer token (QUERYAPIGATE_METRICS_TOKEN): its labels name your API keys, queries and connections,
# and the ingress would otherwise publish them. The chart makes one in a Secret of its own (<release>-metrics) - kept
# across upgrades - and the ServiceMonitor sends it. Rendering without the cluster (helm template, Argo CD) can't see
# the one already made, so give your own there: existingSecret. Off: /metrics is open to whatever can reach the pods.
metricsAuth:
  enabled: true
  existingSecret: ""   # a Secret of yours with the token (at least 16 characters) under `key`
  key: token

# Prometheus Operator: scrape /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Allow traffic in only from the ingress controller's namespace (and Prometheus, with serviceMonitor), and out only to
# what egress lists - your databases, Redis, the SIEM - plus DNS. Off by default: the rules depend on your cluster.
networkPolicy:
  enabled: false
  ingressFrom: []    # e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  egress: []         # e.g. [{to: [{ipBlock: {cidr: 10.0.0.0/16}}], ports: [{port: 5432}]}]

# Several pods on PostgreSQL and Redis only.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Files the settings name by path - the SIEM's CA and client certificate (QUERYAPIGATE_AUDIT_SYSLOG_CA, _CERT, _KEY), a
# directory for exports (QUERYAPIGATE_EXPORT_DIRS, QUERYAPIGATE_AUDIT_LOG_EXPORT_FILE) - mounted into every pod. The root
# filesystem is read-only: anything QueryAPIGate writes outside /data and /tmp needs a volume here.
extraVolumes: []        # e.g. [{name: siem-tls, secret: {secretName: siem-client-tls}}]
extraVolumeMounts: []   # e.g. [{name: siem-tls, mountPath: /etc/queryapigate/siem, readOnly: true}]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
