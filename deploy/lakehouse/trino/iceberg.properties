# Iceberg tables: their metadata in a JDBC catalog (PostgreSQL), their data as Parquet in the `lakehouse` bucket
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=postgres
iceberg.jdbc-catalog.connection-password=lakehouse
iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse
fs.native-s3.enabled=true
s3.endpoint=http://storage:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakehouse
s3.aws-secret-key=lakehouse-secret
